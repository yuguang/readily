[pytest]
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    eval: marks tests as LLM quality evals (requires GEMINI_API_KEY; slow)

testpaths = backend/tests backend/evals

filterwarnings =
    ignore::DeprecationWarning:litellm
    ignore:builtin type.*has no __module__:DeprecationWarning
